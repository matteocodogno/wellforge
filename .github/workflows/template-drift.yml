# Reusable template-drift heartbeat (WellForge Phase 14b, Pillar 6 lifecycle). On a schedule,
# a generated project checks whether it has fallen behind its template: it reads
# .forge/manifest.json (the recorded template version), resolves the latest vX.Y.Z release of
# the template source repo, and — if behind — files/updates ONE deduplicated "N releases behind"
# issue pointing at /wellforge:upgrade. It closes the issue when the project catches up. Surface,
# never auto-ship: it never runs the upgrade itself.
#   template-drift:
#     uses: matteocodogno/wellforge/.github/workflows/template-drift.yml@gates-v7
name: template-drift

on:
  workflow_call:
    inputs:
      manifest-path:
        description: path to the WellForge manifest in the project
        required: false
        type: string
        default: .forge/manifest.json
      source-repo:
        description: >
          owner/repo of the template source. Empty = read `answers.gates_repo` from the
          manifest (the WellForge default, where the template and gates share a repo).
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: manifest vs latest release
    runs-on: ubuntu-latest
    outputs:
      behind: ${{ steps.cmp.outputs.behind }}
      title: ${{ steps.cmp.outputs.title }}
      body: ${{ steps.cmp.outputs.body }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare recorded version to latest release
        id: cmp
        env:
          MANIFEST: ${{ inputs.manifest-path }}
          SOURCE_REPO: ${{ inputs.source-repo }}
        run: |
          set -euo pipefail
          emit() { { echo "behind=$1"; echo "title=$2";
                     echo "body<<__EOF__"; printf '%s\n' "$3"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"; }

          if [ ! -f "$MANIFEST" ]; then
            echo "::notice::no $MANIFEST — not a WellForge scaffold; skipping drift check"
            emit false "" ""; exit 0
          fi
          current=$(jq -r '.version // empty' "$MANIFEST")
          repo="$SOURCE_REPO"
          [ -z "$repo" ] && repo=$(jq -r '.answers.gates_repo // empty' "$MANIFEST")
          if [ -z "$current" ] || [ -z "$repo" ]; then
            echo "::notice::manifest missing version or source repo; skipping"
            emit false "" ""; exit 0
          fi

          # Latest vX.Y.Z releases of the template source (public repo → no auth needed).
          if ! tags=$(git ls-remote --tags "https://github.com/$repo" 'v[0-9]*' 2>/dev/null); then
            echo "::warning::could not reach $repo to list releases; skipping (won't cry wolf)"
            emit false "" ""; exit 0
          fi
          versions=$(printf '%s\n' "$tags" \
            | sed -n 's#.*refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' | sort -Vu)
          latest=$(printf '%s\n' "$versions" | tail -1)
          if [ -z "$latest" ]; then
            echo "::notice::no vX.Y.Z releases found for $repo; skipping"
            emit false "" ""; exit 0
          fi

          # Count releases strictly newer than the recorded version (version-aware compare).
          behind_n=0
          while IFS= read -r v; do
            [ -z "$v" ] && continue
            [ "$v" = "$current" ] && continue
            newer=$(printf '%s\n%s\n' "$current" "$v" | sort -V | tail -1)
            [ "$newer" = "$v" ] && behind_n=$((behind_n + 1))
          done <<< "$versions"

          if [ "$behind_n" -eq 0 ]; then
            echo "::notice::template current ($current, latest $latest)"
            emit false "" ""; exit 0
          fi

          plural=""; [ "$behind_n" -ne 1 ] && plural="s"
          title="📦 Template ${behind_n} release${plural} behind (${current} → ${latest})"
          body=$(cat <<MSG
          This project was scaffolded from template version **${current}** and is now
          **${behind_n} release${plural} behind** the latest, **${latest}**.

          Upgrade re-runs \`copier update\` against the newer template with AI conflict
          resolution — from inside the project:

          \`\`\`
          /wellforge:upgrade
          \`\`\`

          This issue is **updated in place** each run and **closes automatically** once the
          project reaches the latest release. Surface only — the upgrade is never run for you.
          MSG
          )
          echo "::notice::$title"
          emit true "$title" "$body"

  # `failed` is computed from an OUTPUT, and a job that crashed produces no outputs — so
  # `needs.check.outputs.behind` was the empty string, `'' == 'true'` was false, and
  # heartbeat-report CLOSED the drift issue with "green again". An internal error therefore
  # resolved the very issue that exists to surface a problem, which is the worst available
  # failure mode for a heartbeat: silence that looks like health.
  #
  # So this job now runs ONLY on a successful check, and a separate one below speaks up when
  # the check did not succeed. `if: always()` is kept nowhere that decides green/red.
  #
  # NOTE on `uses: ./...`, deliberately kept local. Per GitHub's reusable-workflow docs a
  # `./` reference resolves against the repository containing THIS file, at the same commit
  # — which is precisely what is wanted: a consumer calling template-drift.yml@gates-v13 gets
  # heartbeat-report.yml from gates-v13. Fully qualifying it would be worse, not better,
  # because `uses:` accepts no contexts or expressions: the ref would have to be a hardcoded
  # `@gates-vN` literal that must be bumped by hand every release and goes stale silently.
  # (The generated projects spell it out only because Jinja renders their `uses:` to a
  # literal at scaffold time, which is a different mechanism.)
  report:
    name: file / update the drift issue
    needs: check
    if: needs.check.result == 'success'
    uses: ./.github/workflows/heartbeat-report.yml
    permissions:
      contents: read
      issues: write
    with:
      failed: ${{ needs.check.outputs.behind == 'true' }}
      issue-label: template-drift
      issue-title: ${{ needs.check.outputs.title || '📦 Template drift' }}
      body: ${{ needs.check.outputs.body }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # The heartbeat failing is itself news. Without this the only signal was an empty output
  # silently read as "not behind".
  heartbeat-failed:
    name: heartbeat could not run
    needs: check
    if: needs.check.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Say so, loudly, and do not touch the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "::error::template-drift check did not succeed (result: ${RESULT}) — the drift" \
               "issue has been left exactly as it was. Its state is now UNKNOWN, not green."
          # Comment on the existing drift issue if there is one, so the staleness is visible
          # where someone will look. Never close it, never open a new one: this job knows
          # that the check failed, not whether the project is behind.
          num=$(gh issue list --label template-drift --state open \
                  --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${num:-}" ] && [ "${num}" != "null" ]; then
            gh issue comment "$num" --body \
              "⚠️ The template-drift heartbeat **could not run** (job result: \`${RESULT}\`). This issue is unchanged and its contents may be stale — it was neither updated nor closed. [Run log](${RUN_URL})" \
              || echo "::warning::could not comment on issue #${num}"
          else
            echo "::warning::no open template-drift issue to annotate; the failure is in this run log only"
          fi
