# Reusable quality gate — Node/TypeScript packages (frontend or Hono backend).
# Called by generated projects:  uses: matteocodogno/wellforge/.github/workflows/quality-node.yml@gates-v0
# Thresholds live HERE — changing them requires a PR to gates/ (the single discretion point).
name: quality-node

on:
  workflow_call:
    inputs:
      working-directory:
        description: Package directory (e.g. frontend, backend)
        required: true
        type: string
      gates-repo:
        description: owner/repo hosting gate configs
        required: false
        type: string
        default: matteocodogno/wellforge
      gates-ref:
        description: tag/ref of the gates release
        required: false
        type: string
        # Default is EMPTY on purpose, resolved below to github.job_workflow_sha — the exact
        # commit of THIS reusable workflow. A hardcoded default rots: it used to be `gates-v0`,
        # where the semgrep config was still named welld.yml, so any caller that omitted this
        # input silently checked out 2026-06 configs and semgrep died with exit 7
        # (config not found). Pass it explicitly anyway; this is the safety net.
        default: ''
      # ── Service containers for integration tests ──────────────────────
      # GitHub's `services:` block cannot be passed in as an input (workflow_call inputs are
      # scalars only), and hardcoding postgres here would serve one stack and no other. So the
      # gate brings up the PROJECT'S OWN compose file instead: whatever a project runs locally
      # — postgres, mailhog, redis, minio — is exactly what CI gets, and adding a service needs
      # no gate change at all.
      compose-file:
        description: compose file to bring up (healthy) before tests, repo-relative. Empty = no services.
        required: false
        type: string
        default: ''
      env-file:
        description: KEY=VALUE file exported into the job env before tests. Single-line values only.
        required: false
        type: string
        default: ''
      pretest-command:
        description: shell command run in working-directory once services are healthy (migrations, seed)
        required: false
        type: string
        default: ''
      # Ratchet baselines for brownfield adoption: 0 (default) = central
      # thresholds apply. A non-zero baseline replaces the central minimum for
      # THIS project — it may only ever be raised (PR review enforces that),
      # and the gap to the central target is reported on every run.
      coverage-lines-baseline:
        description: per-project line-coverage ratchet (0 = central threshold)
        required: false
        type: number
        default: 0
      coverage-branches-baseline:
        description: per-project branch-coverage ratchet (0 = central threshold)
        required: false
        type: number
        default: 0
      # Rigor tier (see the wellforge rigor-tiers skill). `production` (default) enforces
      # everything. `mvp` makes COVERAGE advisory — the numbers are still computed and
      # reported (gap-to-target), but they don't fail the run. Lint, typecheck, dependency
      # audit and SAST always block, in every tier — the non-negotiable security floor.
      rigor:
        description: production (enforce all) | mvp (coverage advisory)
        required: false
        type: string
        default: production

env:
  # ── Central thresholds ──────────────────────────────────────────────
  COVERAGE_LINES: "80"
  COVERAGE_BRANCHES: "70"
  AUDIT_LEVEL: high
  # Keep this pin CURRENT, not just reproducible. semgrep ships as a Python app, and old
  # releases stop starting on new runner Pythons: 1.96.0 pulled an opentelemetry-instrumentation
  # that imports `pkg_resources`, which Python 3.12+ dropped and setuptools >= 81 REMOVED — so
  # "install setuptools" is not a fix (it needs setuptools<81, pinning a second EOL package).
  # A stale pin is a silently red SAST gate for every downstream project. See ci.yml's
  # `sast-selftest` job — it fails here first if this pin stops running.
  SEMGREP_VERSION: 1.172.0
  SEMGREP_SEND_METRICS: "off"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout gate configs
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.gates-repo }}
          ref: ${{ inputs.gates-ref || github.job_workflow_sha }}
          path: .wellforge-gates

      - name: Verify gate configs resolved
        run: |
          ref="${{ inputs.gates-ref || github.job_workflow_sha }}"
          missing=0
          for f in gates/configs/semgrep/wellforge.yml; do
            [ -f ".wellforge-gates/$f" ] || { echo "::error::gate config missing at ref ${ref}: $f"; missing=1; }
          done
          if [ "$missing" = "1" ]; then
            echo "::error::The gates checkout (${{ inputs.gates-repo }}@${ref}) does not contain this gate's configs. Pass gates-ref explicitly, matching the tag you call this workflow with."
            exit 1
          fi
          echo "gate configs OK at ${ref}"

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v2

      - name: Require lockfile (reproducible builds)
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml missing in ${{ inputs.working-directory }} — run 'mise run install' locally and commit the lockfile."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: pnpm run lint

      - name: Type check
        working-directory: ${{ inputs.working-directory }}
        run: pnpm run typecheck

      - name: Start service containers
        if: inputs.compose-file != ''
        env:
          COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
        run: |
          # --wait blocks until every service that declares a healthcheck reports healthy, so
          # tests never race a still-booting database. Services without one only need to be
          # running; add a healthcheck if a test flakes on startup timing.
          docker compose -f "$COMPOSE_FILE_INPUT" up -d --wait --wait-timeout 180
          docker compose -f "$COMPOSE_FILE_INPUT" ps

      - name: Export env file
        if: inputs.env-file != ''
        env:
          ENV_FILE_INPUT: ${{ inputs.env-file }}
        run: |
          # Only well-formed single-line KEY=VALUE pairs; comments and blank lines are skipped
          # rather than corrupting $GITHUB_ENV.
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$ENV_FILE_INPUT" >> "$GITHUB_ENV"
          echo "exported $(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' "$ENV_FILE_INPUT") var(s)"

      - name: Pre-test setup (migrations, seed)
        if: inputs.pretest-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          PRETEST_COMMAND: ${{ inputs.pretest-command }}
        run: sh -euc "$PRETEST_COMMAND"

      - name: Tests + coverage
        working-directory: ${{ inputs.working-directory }}
        run: |
          LINES="$COVERAGE_LINES" BRANCHES="$COVERAGE_BRANCHES"
          if [ "${{ inputs.rigor }}" = "mvp" ]; then
            # rigor: mvp — coverage advisory. Run with 0 thresholds so the run never fails
            # on coverage; vitest still prints the actual table (the gap to target is visible).
            echo "::notice::rigor mvp — coverage ADVISORY (central target ${COVERAGE_LINES}% lines / ${COVERAGE_BRANCHES}% branches, not enforced). Promote with /wellforge:promote to enforce."
            LINES=0 BRANCHES=0
          else
            if [ "${{ inputs.coverage-lines-baseline }}" != "0" ]; then
              LINES="${{ inputs.coverage-lines-baseline }}"
              echo "::notice::ratchet baseline in effect: lines ≥ ${LINES}% (central target ${COVERAGE_LINES}%) — raise-only, via PR"
            fi
            if [ "${{ inputs.coverage-branches-baseline }}" != "0" ]; then
              BRANCHES="${{ inputs.coverage-branches-baseline }}"
              echo "::notice::ratchet baseline in effect: branches ≥ ${BRANCHES}% (central target ${COVERAGE_BRANCHES}%)"
            fi
          fi
          pnpm exec vitest run --coverage \
            --coverage.thresholds.lines="$LINES" \
            --coverage.thresholds.branches="$BRANCHES"

      - name: Dependency audit (fail on ${{ env.AUDIT_LEVEL }}+)
        working-directory: ${{ inputs.working-directory }}
        run: pnpm audit --prod --audit-level "$AUDIT_LEVEL"

      - name: Semgrep SAST
        working-directory: ${{ inputs.working-directory }}
        run: |
          pipx run semgrep=="$SEMGREP_VERSION" scan \
            --config "$GITHUB_WORKSPACE/.wellforge-gates/gates/configs/semgrep/wellforge.yml" \
            --config p/typescript \
            --error --severity ERROR \
            --exclude .wellforge-gates

      - name: Service logs (on failure)
        if: failure() && inputs.compose-file != ''
        env:
          COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
        run: docker compose -f "$COMPOSE_FILE_INPUT" logs --no-color --tail 200

      - name: Stop service containers
        if: always() && inputs.compose-file != ''
        env:
          COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
        run: docker compose -f "$COMPOSE_FILE_INPUT" down -v
