# Self-CI for the WellForge repo itself.
#
# The other workflows here (quality-*.yml, commit-lint.yml, linear-history.yml, quality-eval.yml) are REUSABLE
# gates with `on: workflow_call` only — they exist to be called by GENERATED projects and
# never self-trigger. This file is the one workflow with real event triggers, so the
# wellforge repo eats its own dog food: it lints its own commits, keeps its own history
# linear, guards model-routing drift, and proves both presets still scaffold a valid project.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Conventional Commits on wellforge's OWN history. Inline (not the reusable commit-lint.yml)
  # because this repo also pushes straight to main — we lint the push range too, and we test
  # HEAD's validator rather than the released gates-v* copy.
  commits:
    name: commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0           # need the full commit range
      - name: Lint commit messages
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # first push to a branch / unknown base → nothing to diff against
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no comparable base ($base) — skipping"; exit 0
          fi
          fail=0
          for sha in $(git rev-list "$base..$head"); do
            msg=$(git log -1 --format=%B "$sha")
            if ! printf '%s' "$msg" | python3 gates/scripts/check-commit-msg.py -; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          exit $fail

  # Linear history on wellforge's OWN history. Inline (not the reusable linear-history.yml) for
  # the same reason as `commits`: this repo also pushes straight to main, so the push range is
  # checked too, and against HEAD's rules rather than the released gates-v* copy.
  linear:
    name: linear history (no merge commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assert no merge commits
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no comparable base ($base) — skipping"; exit 0
          fi
          merges=$(git rev-list --merges "$base..$head")
          [ -z "$merges" ] && { echo "OK — no merge commits"; exit 0; }
          for sha in $merges; do
            echo "::error::merge commit $(git log -1 --format='%h %s' "$sha") — rebase instead (git rebase origin/main)"
          done
          exit 1

  # Model-routing drift guard: every agent's frontmatter `model:` must match routing × tiers.
  routing:
    name: model-routing drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: check-routing.py (claude)
        working-directory: wellforge-plugin
        run: uv run --with pyyaml python scripts/check-routing.py --tool claude
      # Docs drift: a command nobody can find in the README, a skill description over the
      # loader's limit, or CLAUDE.md quoting a stale plugin version. All silent failures.
      - name: check-docs.py
        working-directory: wellforge-plugin
        run: uv run --with pyyaml python scripts/check-docs.py
      # Session-injection budget: every description is loaded into every session in every
      # project where the plugin is enabled. The ceiling is a ratchet at today's total, so
      # growth has to be a decision rather than an accident.
      - name: check-budget.py
        working-directory: wellforge-plugin
        run: uv run --with pyyaml python scripts/check-budget.py

  # Eval-rubric mirror guard. The rubric is central in gates/configs/, but a SCAFFOLDED
  # project has no gates/ on disk (gates are referenced by CI, never copied), so the plugin
  # ships a byte-identical mirror that /wellforge:eval falls back to. Two copies means drift,
  # and silent drift here means two projects scored against different standards — so this
  # job is the discretion point's enforcement, same idea as the model-routing guard above.
  rubric-sync:
    name: eval-rubric mirror in sync with gates/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gates/configs/eval-rubric.yml == wellforge-plugin/config/eval-rubric.yml
        run: |
          if ! cmp -s gates/configs/eval-rubric.yml wellforge-plugin/config/eval-rubric.yml; then
            echo "::error::eval-rubric mirror drifted from the central rubric."
            echo "The central copy is gates/configs/eval-rubric.yml. Refresh the mirror with:"
            echo "  cp gates/configs/eval-rubric.yml wellforge-plugin/config/eval-rubric.yml"
            diff -u gates/configs/eval-rubric.yml wellforge-plugin/config/eval-rubric.yml || true
            exit 1
          fi
          echo "OK — rubric mirror is byte-identical"

  # Gate-callable self-test: call a reusable gate with NO gates-ref and prove the fallback
  # (github.job_workflow_sha) resolves to a real commit and its configs are found. A caller
  # omitting gates-ref used to silently get `gates-v0` — 2026-06 configs, where the semgrep
  # rules were still named welld.yml — which surfaced downstream as semgrep exit 7.
  # commit-lint is the cheapest gate to exercise this with (no toolchain, no install).
  gate-callable:
    name: reusable gate callable with default gates-ref
    uses: ./.github/workflows/commit-lint.yml

  # SAST self-test. The gates ship semgrep as a PINNED Python app, and an old pin eventually
  # stops starting on a newer runner Python — which surfaces as a red SAST gate in every
  # downstream project, not here (this repo runs no quality-*.yml on itself). That is exactly
  # how the 1.96.0 / pkg_resources breakage reached a pilot project before us. This job runs
  # the pinned semgrep against a known-bad and a known-good fixture, so the pin failing to run,
  # the rules failing to parse, or the rules failing to FIRE all break wellforge's own CI first.
  sast-selftest:
    name: SAST self-test (pinned semgrep runs + rules fire)
    runs-on: ubuntu-latest
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@v7

      - name: Read the pin from the gates (and assert node/jvm agree)
        id: pin
        run: |
          node=$(grep -E '^\s*SEMGREP_VERSION:' .github/workflows/quality-node.yml | awk '{print $2}')
          jvm=$(grep -E '^\s*SEMGREP_VERSION:' .github/workflows/quality-jvm.yml | awk '{print $2}')
          if [ "$node" != "$jvm" ]; then
            echo "::error::gates pin different semgrep versions (node=$node jvm=$jvm)"; exit 1
          fi
          echo "version=$node" >> "$GITHUB_OUTPUT"
          echo "pinned semgrep: $node"

      - name: Fixtures
        run: |
          mkdir -p /tmp/sast/bad/src/main/kotlin /tmp/sast/good/src
          # Deliberately LOW-entropy placeholder: it must trip wellforge-hardcoded-secret
          # (16+ chars after an api_key-ish name) without tripping the gitleaks security
          # floor, which scans this workflow file itself and rejects a realistic-looking key.
          cat > /tmp/sast/bad/src/bad.ts <<'EOF'
          const apiKey = "notarealsecretnotarealsecret";
          export function f() { debugger; return apiKey; }
          EOF
          printf 'fun main() {\n    println("hello")\n}\n' > /tmp/sast/bad/src/main/kotlin/App.kt
          printf 'export function g(): number { return 42; }\n' > /tmp/sast/good/src/good.ts

      - name: Known-bad fixture must FAIL the gate
        run: |
          if pipx run semgrep=="${{ steps.pin.outputs.version }}" scan \
               --config "$GITHUB_WORKSPACE/gates/configs/semgrep/wellforge.yml" \
               --error --severity ERROR /tmp/sast/bad; then
            echo "::error::semgrep did not flag the known-bad fixture — rules stopped firing"
            exit 1
          fi
          echo "OK — known-bad fixture rejected"

      - name: Known-good fixture must PASS the gate
        run: |
          pipx run semgrep=="${{ steps.pin.outputs.version }}" scan \
            --config "$GITHUB_WORKSPACE/gates/configs/semgrep/wellforge.yml" \
            --error --severity ERROR /tmp/sast/good
          echo "OK — known-good fixture accepted"

  # Both presets must still scaffold a valid project from the root copier.yml with --defaults.
  # We assert the CONTRACT's required files exist; no build (keeps CI fast, no toolchains).
  scaffold:
    name: scaffold ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [spring-kotlin-react, hono-react, pulumi-gcp-ts]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --vcs-ref HEAD is load-bearing. Without it copier resolves a local git template to
      # its latest TAG (v0.9.0), so this job validated the last release on every run and a
      # PR that broke a template passed it. Verified: the default render produced a
      # .claude/settings.json without the keys HEAD adds; `--vcs-ref HEAD` produced them.
      - name: copier copy --defaults (this branch, not the last tag)
        run: uvx copier copy --defaults --trust --vcs-ref HEAD . /tmp/out --data preset=${{ matrix.preset }}
      - name: Assert every gate call passes gates-repo + gates-ref
        run: |
          # A generated workflow that calls a gate WITHOUT these inputs falls back to the
          # gate's own default. That default used to be `gates-v0` and produced a semgrep
          # exit 7 in a pilot project. The fallback is fixed, but explicit beats implicit:
          # the pin a project is on must be readable in the project's own workflow file.
          uv run --with pyyaml python - <<'PY'
          import pathlib, re, sys, yaml
          TAKES = ('quality-node.yml', 'quality-jvm.yml', 'commit-lint.yml')
          fail = 0
          for wf in sorted(pathlib.Path('/tmp/out/.github/workflows').glob('*.yml')):
              doc = yaml.safe_load(wf.read_text())
              for name, job in (doc.get('jobs') or {}).items():
                  uses = job.get('uses', '')
                  gate = uses.split('/')[-1].split('@')[0]
                  if gate not in TAKES:
                      continue
                  with_ = job.get('with') or {}
                  for inp in ('gates-repo', 'gates-ref'):
                      if inp not in with_:
                          print(f"::error::{wf.name}: job '{name}' calls {gate} without '{inp}'")
                          fail = 1
                  if not uses.split('@')[-1].startswith('gates-v'):
                      print(f"::error::{wf.name}: job '{name}' is not pinned to a gates-v* tag: {uses}")
                      fail = 1
              print(f"  checked {wf.name}")
          sys.exit(fail)
          PY

      # Scaffolding at HEAD means `git describe` can hand copier a NON-template tag: a
      # project cut from a plugin-tagged commit records `_commit: plugin-v2.42.0`. Measured,
      # not theoretical. It does not reach the manifest (that comes from the
      # template_version answer), and the manifest is what /wellforge:upgrade and
      # fleet-status.sh read — so pin exactly that, and let `_commit` be noisy in /tmp.
      - name: Manifest still records a TEMPLATE version
        run: |
          v=$(python3 -c "import json;print(json.load(open('/tmp/out/.forge/manifest.json'))['version'])")
          echo "manifest version: $v"
          case "$v" in
            *[!0-9.]*|"") echo "::error::manifest version '$v' is not a template version — a non-template tag leaked into the scaffold"; exit 1 ;;
            *) echo "OK — template-shaped" ;;
          esac

      - name: Assert required generated files (templates/_shared/CONTRACT.md)
        run: |
          fail=0
          for f in .forge/manifest.json .copier-answers.yml AGENTS.md CLAUDE.md \
                   .claude/settings.json specs/README.md mise.toml \
                   .github/workflows/quality.yml .gitignore README.md; do
            if [ -e "/tmp/out/$f" ]; then echo "  OK  $f"; else echo "::error::missing $f"; fail=1; fi
          done
          exit $fail

  # Per-worktree database isolation (template v0.10.0, ADR 0002). Two git worktrees of one
  # repo used to resolve the same database name, host port and compose project, so a
  # parallel batch could drop the database a sibling was mid-test against — a failure that
  # never looks like a collision, only like broken code. The isolation is DERIVED from the
  # checkout path, which makes it exactly the kind of thing that silently stops deriving: an
  # untrusted mise config, a renamed script, a lost `{% raw %}` in the template, and every
  # checkout quietly shares one database again with nothing red anywhere.
  #
  # Asserts the PROPERTY, not the plumbing: scaffold, branch it into two worktrees, and prove
  # the names differ, the guard refuses a foreign database, and neither worktree can reach
  # the other's. Deliberately toolchain-free — `mise env` resolves the [env] block without
  # installing Java or Node, so this job costs seconds and never blocks on a toolchain.
  worktree-isolation:
    name: per-worktree database isolation (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [hono-react, spring-kotlin-react]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: jdx/mise-action@v2
        with:
          install: false          # the mise binary only — no project tools needed here

      - name: Scaffold, then branch it into two worktrees
        run: |
          uvx copier copy --defaults --trust --vcs-ref HEAD . /tmp/wt --data preset=${{ matrix.preset }}
          cd /tmp/wt
          git init -q . && git add -A
          git -c user.email=ci@wellforge -c user.name=ci commit -qm "chore: scaffold"
          git worktree add -q /tmp/wt-a -b feat-a
          git worktree add -q /tmp/wt-b -b feat-b
          # `mise trust` is the one carry-in these derived values need. An untrusted config
          # resolves to nothing instead of failing, and "resolves to nothing" IS the
          # collision — every checkout falls back to the same database.
          for d in /tmp/wt /tmp/wt-a /tmp/wt-b; do (cd "$d" && mise trust -q .); done

      - name: Three checkouts must derive three different identities
        run: |
          read_var() { (cd "$1" && mise env 2>/dev/null | sed -n "s/^export $2=//p" | tr -d "'"); }
          fail=0
          for v in WF_DB_NAME WF_DB_PORT COMPOSE_PROJECT_NAME; do
            main=$(read_var /tmp/wt "$v"); a=$(read_var /tmp/wt-a "$v"); b=$(read_var /tmp/wt-b "$v")
            echo "  $v: main=$main  a=$a  b=$b"
            if [ -z "$a" ] || [ -z "$b" ]; then
              echo "::error::$v did not resolve in a worktree — the [env] derivation is not running"
              fail=1; continue
            fi
            # The primary tree keeps the plain value by design; the worktrees must differ
            # from each other AND from it.
            if [ "$a" = "$b" ] || [ "$a" = "$main" ] || [ "$b" = "$main" ]; then
              echo "::error::$v is shared across checkouts (main=$main a=$a b=$b) — two checkouts, one name"
              fail=1
            fi
          done
          exit $fail

      - name: db:guard is wired in, refuses a foreign database, allows its own
        run: |
          # Wiring first: a guard nothing depends on protects nothing.
          for t in test dev; do
            if ! grep -A4 "^\[tasks\.$t\]" /tmp/wt/mise.toml | grep -q 'depends.*db:guard'; then
              echo "::error::[tasks.$t] in the generated mise.toml does not depend on db:guard"; exit 1
            fi
            echo "  [tasks.$t] depends on db:guard"
          done
          cd /tmp/wt-a
          eval "$(mise env -s bash)"
          sh .wellforge/db-guard.sh                       # its own database — must pass
          # Now point it at the primary tree's database, the way a real override would.
          if DATABASE_URL="postgres://u:p@localhost:5432/my_service" sh .wellforge/db-guard.sh; then
            echo "::error::db:guard allowed a database belonging to another checkout"; exit 1
          fi
          echo "OK — guard refused the foreign database"

      - name: Two worktrees bring their databases up CONCURRENTLY without meeting
        run: |
          up() { ( cd "$1" && eval "$(mise env -s bash)" && docker compose up -d --wait --wait-timeout 180 ); }
          up /tmp/wt-a & a=$!
          up /tmp/wt-b & b=$!
          wait $a && wait $b
          # hono-react's compose user is `postgres`; spring-kotlin-react's is the slug.
          user=postgres; [ "${{ matrix.preset }}" = "spring-kotlin-react" ] && user=my-service
          for d in a b; do
            ( cd /tmp/wt-$d && eval "$(mise env -s bash)" \
              && got=$(docker compose exec -T postgres psql -U "$user" -d "$WF_DB_NAME" -tAc 'select current_database()' | tr -d '\r') \
              && echo "  wt-$d expected=$WF_DB_NAME actual=$got" \
              && [ "$got" = "$WF_DB_NAME" ] ) \
              || { echo "::error::wt-$d did not reach its own database"; exit 1; }
          done
          # The decisive one: A must not even be able to SEE B's database.
          other=$(cd /tmp/wt-b && mise env 2>/dev/null | sed -n 's/^export WF_DB_NAME=//p' | tr -d "'")
          if ( cd /tmp/wt-a && eval "$(mise env -s bash)" \
               && docker compose exec -T postgres psql -U "$user" -d "$other" -tAc 'select 1' ) 2>/dev/null; then
            echo "::error::worktree A reached worktree B's database '$other'"; exit 1
          fi
          echo "OK — A cannot reach B's database"

      - name: Teardown
        if: always()
        run: |
          for d in a b; do
            ( cd /tmp/wt-$d && eval "$(mise env -s bash)" && docker compose down -v ) || true
          done

  # Service-container self-test. The gates start a project's OWN compose file so integration
  # tests get a real database (a pilot project hit this: shared node gate, no Postgres, red
  # CI). What can rot here is the generated compose file itself — a missing/broken healthcheck
  # makes `up --wait` return before the DB accepts connections, and tests flake downstream.
  # So: generate a scaffold, run the exact lifecycle the gate runs, and prove connectivity.
  services-selftest:
    name: service containers (compose up --wait → connect → down)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Scaffold hono-react (db=postgres)
        # --vcs-ref HEAD for the same reason as the scaffold job: the default is the last tag.
        run: uvx copier copy --defaults --trust --vcs-ref HEAD . /tmp/svc --data preset=hono-react

      - name: Bring services up, exactly as the gate does
        working-directory: /tmp/svc
        run: |
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 180
          docker compose -f docker-compose.yml ps

      - name: Prove the database actually accepts connections
        working-directory: /tmp/svc
        run: |
          # `--wait` is only as good as the compose healthcheck. If this select fails while
          # the step above passed, the healthcheck is lying and downstream tests will flake.
          docker compose exec -T postgres psql -U postgres -d my_service -c 'select 1;'

      - name: Env file matches the compose service
        working-directory: /tmp/svc
        run: |
          # The generated quality.yml exports this file so tests can parse DATABASE_URL;
          # if the two ever drift, integration tests connect to the wrong database.
          # NB: the file is a dotfile — `backend/*.example` does NOT match it.
          url=$(grep -hE '^DATABASE_URL=' backend/.env.example | head -1 | cut -d= -f2-)
          echo "DATABASE_URL=$url"
          case "$url" in
            *@localhost:5432/my_service) echo "OK — matches docker-compose.yml" ;;
            *) echo "::error::env example does not match the compose service: $url"; exit 1 ;;
          esac

      - name: Teardown
        if: always()
        working-directory: /tmp/svc
        run: docker compose -f docker-compose.yml down -v

  # pre-bash-guard regression matrix. This hook blocks on COMMAND TEXT, so every rule is an
  # approximation with two ways to be wrong: waving a real secret through, or blocking
  # innocent text until people route around it (a workaround for one of its false positives
  # is what turned this very workflow red). The matrix pins both directions.
  hook-fixtures:
    name: plugin hooks (bash-guard + file-guard + stop-verify + spec-guard matrices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: wellforge-plugin/hooks/scripts/tests/pre-bash-guard.test.sh
      - run: wellforge-plugin/hooks/scripts/tests/pre-file-guard.test.sh
      # stop-verify guards what the hook can SEE (merge base, not just unstaged) and what it
      # costs (no `clean`, bounded). Both regressions are invisible in a session: the hook
      # just stops blocking. Ubuntu has coreutils `timeout`, so the budget case runs here
      # even though it skips on a bare macOS.
      - run: wellforge-plugin/hooks/scripts/tests/stop-verify.test.sh
      # The lifecycle rules as mechanism: only a met gate writes `status: done`, rigor never
      # goes down, a closed feature does not reopen by edit. Prompt promises until they had
      # a hook and a matrix.
      - run: wellforge-plugin/hooks/scripts/tests/post-spec-guard.test.sh
      # Cost attribution: parallel runs used to count each other's tokens, and the pricing
      # table had drifted stale behind a "keep in sync" comment. Neither fails loudly on
      # its own — a wrong cost estimate still prints a number.
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with pyyaml python wellforge-plugin/scripts/tests/run-report.test.py
      # forge-state is what status/triage/done/promote read instead of re-deriving feature
      # state with the model. It is the one place that state is computed, so it is the one
      # place it can regress — every status, tier, drift case and verdict kind is pinned.
      - run: uv run --with pyyaml python wellforge-plugin/scripts/tests/forge-state.test.py
      # Which paths pull in a security review. Glob matching looks right and silently
      # misses `migrations/001.sql` when the pattern says `**/` — a miss nobody sees.
      - run: uv run --with pyyaml python wellforge-plugin/scripts/tests/security-triggers.test.py

  # Adapter outputs. Both generators print a healthy summary whether or not what they wrote
  # is usable — they count files, and every failure in this class is invisible in a count:
  # 44 zero-byte skill files reported as "44 skill files", two links that resolved in the
  # plugin tree and nowhere in Copilot's, a model name that no longer matches the routing
  # policy. The adapters are how WellForge reaches teams not on Claude Code, and nobody here
  # opens their output, so CI is the only reader they get.
  adapter-smoke:
    name: adapter smoke test (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [copilot, opencode]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Asserts, on freshly generated output: (a) no empty file, (b) every relative link
      # resolves, (c) every plugin command/agent/skill has a counterpart or is declared
      # absent in the adapter README, (d) generated model names == config/model-tiers.yml.
      # adapters/<name>/SMOKE-TEST.md is the human pass this is the mechanical half of.
      - run: uv run --with pyyaml python adapters/smoke-test.py --adapter ${{ matrix.adapter }}

  # The CLI. `scripts/wellforge` is the first thing a teammate runs and was, until now, the
  # only untested code in this repo — the hook matrices, run-report, forge-state and the
  # adapters all had one. It is unusually testable precisely because every external
  # dependency is a command on PATH, so the suite replaces brew/claude/gh/docker/curl with
  # recording shims and drives the real script.
  #
  # Both halves matter and catch different things: shellcheck finds the quoting and
  # expansion faults that only fire on an unusual input (it caught a dead variable and a
  # broken ${fix:-…} here), while the matrix finds behaviour — a doctor run that aborts
  # mid-report still passes every static check.
  cli:
    name: CLI (shellcheck + regression matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, not just the commit: the suite asserts WELLFORGE_CLI_VERSION equals the
          # newest cli-v* tag, and a default shallow checkout has no tags — which would
          # make that check silently blind rather than failing. It says so if it happens.
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # --severity=warning is the gate: info and style are advisory here (SC2016 and SC2012
      # in particular are deliberate in these scripts — single-quoted jq programs, and `ls`
      # used on a directory of version-shaped names). A genuine warning-level false positive
      # gets an inline `# shellcheck disable=SCxxxx` with the reason on the line above it,
      # never a blanket exclusion — there is exactly one today, on prose containing a tilde.
      # LC_ALL matters: these scripts are full of em dashes, and shellcheck CRASHES writing
      # a finding that contains one under a non-UTF-8 locale
      # ("commitBuffer: invalid argument (cannot encode character '\8212')") — a crash that
      # reads like a parse error in the script rather than a locale problem in the tool.
      - name: shellcheck
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: shellcheck -s bash --severity=warning scripts/wellforge scripts/*.sh
                        wellforge-plugin/hooks/scripts/*.sh

      # Drives the real CLI against shim executables and real git fixtures. Cases marked
      # xfail describe behaviour a later change introduces; the suite fails if one of them
      # starts PASSING, because that means the marker is now lying.
      - name: wellforge CLI matrix
        run: scripts/tests/wellforge.test.sh

  # terse-mode (specs/001-terse-mode) fixture regression tests: were previously reproducible
  # only by hand, referenced by no runner/CI. run-all.sh wires t8/t11/t12 into one exit code.
  terse-mode-fixtures:
    name: terse-mode fixtures (AC-1.2, AC-4.1, AC-5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run terse-mode fixture regression suite
        run: specs/001-terse-mode/fixtures/run-all.sh
