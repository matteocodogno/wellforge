# Self-CI for the WellForge repo itself.
#
# The other workflows here (quality-*.yml, commit-lint.yml, linear-history.yml, quality-eval.yml) are REUSABLE
# gates with `on: workflow_call` only — they exist to be called by GENERATED projects and
# never self-trigger. This file is the one workflow with real event triggers, so the
# wellforge repo eats its own dog food: it lints its own commits, keeps its own history
# linear, guards model-routing drift, and proves both presets still scaffold a valid project.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Conventional Commits on wellforge's OWN history. Inline (not the reusable commit-lint.yml)
  # because this repo also pushes straight to main — we lint the push range too, and we test
  # HEAD's validator rather than the released gates-v* copy.
  commits:
    name: commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0           # need the full commit range
      - name: Lint commit messages
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # first push to a branch / unknown base → nothing to diff against
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no comparable base ($base) — skipping"; exit 0
          fi
          fail=0
          for sha in $(git rev-list "$base..$head"); do
            msg=$(git log -1 --format=%B "$sha")
            if ! printf '%s' "$msg" | python3 gates/scripts/check-commit-msg.py -; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          exit $fail

  # Linear history on wellforge's OWN history. Inline (not the reusable linear-history.yml) for
  # the same reason as `commits`: this repo also pushes straight to main, so the push range is
  # checked too, and against HEAD's rules rather than the released gates-v* copy.
  linear:
    name: linear history (no merge commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Assert no merge commits
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no comparable base ($base) — skipping"; exit 0
          fi
          merges=$(git rev-list --merges "$base..$head")
          [ -z "$merges" ] && { echo "OK — no merge commits"; exit 0; }
          for sha in $merges; do
            echo "::error::merge commit $(git log -1 --format='%h %s' "$sha") — rebase instead (git rebase origin/main)"
          done
          exit 1

  # Model-routing drift guard: every agent's frontmatter `model:` must match routing × tiers.
  routing:
    name: model-routing drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: check-routing.py (claude)
        working-directory: wellforge-plugin
        run: uv run --with pyyaml python scripts/check-routing.py --tool claude

  # Gate-callable self-test: call a reusable gate with NO gates-ref and prove the fallback
  # (github.job_workflow_sha) resolves to a real commit and its configs are found. A caller
  # omitting gates-ref used to silently get `gates-v0` — 2026-06 configs, where the semgrep
  # rules were still named welld.yml — which surfaced downstream as semgrep exit 7.
  # commit-lint is the cheapest gate to exercise this with (no toolchain, no install).
  gate-callable:
    name: reusable gate callable with default gates-ref
    uses: ./.github/workflows/commit-lint.yml

  # SAST self-test. The gates ship semgrep as a PINNED Python app, and an old pin eventually
  # stops starting on a newer runner Python — which surfaces as a red SAST gate in every
  # downstream project, not here (this repo runs no quality-*.yml on itself). That is exactly
  # how the 1.96.0 / pkg_resources breakage reached a pilot project before us. This job runs
  # the pinned semgrep against a known-bad and a known-good fixture, so the pin failing to run,
  # the rules failing to parse, or the rules failing to FIRE all break wellforge's own CI first.
  sast-selftest:
    name: SAST self-test (pinned semgrep runs + rules fire)
    runs-on: ubuntu-latest
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@v5

      - name: Read the pin from the gates (and assert node/jvm agree)
        id: pin
        run: |
          node=$(grep -E '^\s*SEMGREP_VERSION:' .github/workflows/quality-node.yml | awk '{print $2}')
          jvm=$(grep -E '^\s*SEMGREP_VERSION:' .github/workflows/quality-jvm.yml | awk '{print $2}')
          if [ "$node" != "$jvm" ]; then
            echo "::error::gates pin different semgrep versions (node=$node jvm=$jvm)"; exit 1
          fi
          echo "version=$node" >> "$GITHUB_OUTPUT"
          echo "pinned semgrep: $node"

      - name: Fixtures
        run: |
          mkdir -p /tmp/sast/bad/src/main/kotlin /tmp/sast/good/src
          # Deliberately LOW-entropy placeholder: it must trip wellforge-hardcoded-secret
          # (16+ chars after an api_key-ish name) without tripping the gitleaks security
          # floor, which scans this workflow file itself and rejects a realistic-looking key.
          cat > /tmp/sast/bad/src/bad.ts <<'EOF'
          const apiKey = "notarealsecretnotarealsecret";
          export function f() { debugger; return apiKey; }
          EOF
          printf 'fun main() {\n    println("hello")\n}\n' > /tmp/sast/bad/src/main/kotlin/App.kt
          printf 'export function g(): number { return 42; }\n' > /tmp/sast/good/src/good.ts

      - name: Known-bad fixture must FAIL the gate
        run: |
          if pipx run semgrep=="${{ steps.pin.outputs.version }}" scan \
               --config "$GITHUB_WORKSPACE/gates/configs/semgrep/wellforge.yml" \
               --error --severity ERROR /tmp/sast/bad; then
            echo "::error::semgrep did not flag the known-bad fixture — rules stopped firing"
            exit 1
          fi
          echo "OK — known-bad fixture rejected"

      - name: Known-good fixture must PASS the gate
        run: |
          pipx run semgrep=="${{ steps.pin.outputs.version }}" scan \
            --config "$GITHUB_WORKSPACE/gates/configs/semgrep/wellforge.yml" \
            --error --severity ERROR /tmp/sast/good
          echo "OK — known-good fixture accepted"

  # Both presets must still scaffold a valid project from the root copier.yml with --defaults.
  # We assert the CONTRACT's required files exist; no build (keeps CI fast, no toolchains).
  scaffold:
    name: scaffold ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [spring-kotlin-react, hono-react, pulumi-gcp-ts]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: copier copy --defaults
        run: uvx copier copy --defaults --trust . /tmp/out --data preset=${{ matrix.preset }}
      - name: Assert required generated files (templates/_shared/CONTRACT.md)
        run: |
          fail=0
          for f in .forge/manifest.json .copier-answers.yml AGENTS.md CLAUDE.md \
                   .claude/settings.json specs/README.md mise.toml \
                   .github/workflows/quality.yml .gitignore README.md; do
            if [ -e "/tmp/out/$f" ]; then echo "  OK  $f"; else echo "::error::missing $f"; fail=1; fi
          done
          exit $fail

  # terse-mode (specs/001-terse-mode) fixture regression tests: were previously reproducible
  # only by hand, referenced by no runner/CI. run-all.sh wires t8/t11/t12 into one exit code.
  terse-mode-fixtures:
    name: terse-mode fixtures (AC-1.2, AC-4.1, AC-5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run terse-mode fixture regression suite
        run: specs/001-terse-mode/fixtures/run-all.sh
