# Reusable OPT-IN eval gate — LM-judge scoring of a feature against the central rubric.
# This is the non-deterministic verification half (spec fidelity, test quality, code
# conventions, trajectory) that quality-node/jvm.yml (tests, coverage, lint) cannot cover.
#
# Opt-in because it costs Anthropic API tokens: wire it on agent-facing or high-stakes
# changes, not every PR. Consume it pinned:
#   jobs:
#     eval:
#       uses: matteocodogno/wellforge/.github/workflows/quality-eval.yml@gates-v2
#       with: { spec-dir: specs/001-user-auth }
#       secrets: { anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }} }
name: quality-eval

on:
  workflow_call:
    inputs:
      spec-dir:
        description: Feature spec directory to evaluate (e.g. specs/001-user-auth)
        required: true
        type: string
      model:
        description: Judge model
        required: false
        type: string
        default: claude-sonnet-4-6
      gates-repo:
        required: false
        type: string
        default: matteocodogno/wellforge
      gates-ref:
        required: false
        type: string
        # EMPTY, resolved below to github.job_workflow_sha — the exact commit of THIS
        # reusable workflow, the same pattern every other gate uses. It used to default to
        # `gates-v2`: a caller that omitted the input silently evaluated against the rubric
        # and script as they were in 2026-06, and a rubric change would not have reached it.
        # This was the only gate still carrying a hardcoded default.
        default: ''
    secrets:
      anthropic-api-key:
        required: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # need history for the diff the judge reads

      - name: Checkout gate configs
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.gates-repo }}
          ref: ${{ inputs.gates-ref || github.job_workflow_sha }}
          path: .wellforge-gates

      - name: Verify gate configs resolved
        run: |
          set -euo pipefail
          ref="${{ inputs.gates-ref || github.job_workflow_sha }}"
          missing=0
          for f in gates/scripts/run-eval.py gates/configs/eval-rubric.yml; do
            [ -f ".wellforge-gates/$f" ] || { echo "::error::gate file missing at ref ${ref}: $f"; missing=1; }
          done
          if [ "$missing" = "1" ]; then
            echo "::error::The gates checkout (${{ inputs.gates-repo }}@${ref}) does not contain this gate's files. Pass gates-ref explicitly, matching the tag you call this workflow with."
            exit 1
          fi
          echo "gate files OK at ${ref}"

      # `uv run` below needs uv on PATH. Every other job that runs uv installs it; this one
      # relied on the runner image happening to ship it.
      - uses: astral-sh/setup-uv@v7

      - name: LM-judge eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
        run: |
          uv run --with pyyaml --with anthropic \
            "$GITHUB_WORKSPACE/.wellforge-gates/gates/scripts/run-eval.py" \
            --rubric "$GITHUB_WORKSPACE/.wellforge-gates/gates/configs/eval-rubric.yml" \
            --spec-dir "${{ inputs.spec-dir }}" \
            --base "origin/${{ github.event.repository.default_branch }}" \
            --model "${{ inputs.model }}"
