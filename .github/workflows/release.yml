# Publish a GitHub Release when a template tag (vX.Y.Z) is pushed, and prepare the Homebrew
# formula bump that must follow it.
#
# Why the formula bump is a SEPARATE, follow-up commit and not part of the tagged commit:
# the formula pins `sha256` of GitHub's tarball for the tag, and that tarball does not exist
# until the tag is pushed (its root directory is named after the tag, so it isn't byte-equal
# to any pre-tag archive). Chicken-and-egg — so this workflow computes the sha after the fact,
# pushes the bump to a branch, and links a ready-to-open PR. It never writes to main.
#
# Only `v*` triggers: `gates-v*` is a separate series that Homebrew and copier both ignore.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)publish notes for
        required: true
        type: string
      dry-run:
        description: Render notes and compute the sha, but create/push nothing
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ctx.outputs.tag }}
      # Threaded as a STRING. Comparing the raw boolean input against 'true' in the other job
      # silently evaluated to "not dry" (GHA casts a bool/string comparison via number, so
      # true != 'true' is TRUE) and pushed a branch during a dry run. Job outputs are strings.
      dry: ${{ steps.ctx.outputs.dry }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # notes are derived from the commit range between tags

      - name: Resolve context
        id: ctx
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dry=${{ inputs.dry-run || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "releasing $tag (dry-run=${{ inputs.dry-run || 'false' }})"

      - name: Render release notes
        run: |
          ./scripts/release-notes.sh "${{ steps.ctx.outputs.tag }}" > /tmp/notes.md
          cat /tmp/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the Release
        if: steps.ctx.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ctx.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists — updating its notes"
            gh release edit "$tag" --notes-file /tmp/notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md --latest
          fi

# The `formula` job that used to live here is GONE, deliberately.
#
# It rewrote Formula/wellforge.rb's url and sha256 on every TEMPLATE `v*` tag, which is how
# the formula came to point at v0.9.0: the CLI moved to its own `cli-vX.Y.Z` series
# (docs/VERSIONING.md) and this job kept aiming the formula at a series the CLI no longer
# ships in. One file, two owners, and the one that ran most often was the wrong one.
#
# The CLI release path owns the formula now, end to end:
#     scripts/release-cli.sh <patch|minor|major|X.Y.Z> --execute
#     scripts/release-cli.sh X.Y.Z --formula-only --execute     # the formula alone
# It tags first, pushes, and only then fetches the tarball to compute the sha256 — that
# order is forced, because GitHub generates the archive on demand and its bytes are not
# reproducible locally. check-docs.py asserts the formula's version against
# WELLFORGE_CLI_VERSION and the newest cli-v tag, so a formula left behind by a hand edit
# fails CI instead of reaching a brew user.
