# Model pricing for run-report.py cost ESTIMATES (USD per 1M tokens).
# Used only to turn captured token counts into an approximate cost — not billing.
#
# THE ONLY PRICING TABLE. run-report.py used to carry an embedded copy "kept in sync" by
# comment; both drifted years out of date (opus at 15/75, haiku at 0.80/4.00) and nothing
# noticed, because a cost estimate has no failing test. The script now reads this file and
# reports "cost unavailable" if it cannot — a missing number beats a confidently wrong one.
#
# Source of truth: the live pricing page, never memory and never a cached table.
#   https://platform.claude.com/docs/en/about-claude/pricing
# Re-verified against it 2026-09-20 (the previous check went through the `claude-api`
# skill's table, which was itself cached 2026-06-24 — a cache checking a cache). Every base
# rate below matched. Re-check before treating a cost figure as anything but relative.
#
# MATCHING: keys are substrings of the captured model id, matched LONGEST KEY FIRST so a
# specific id wins over a family name. That specificity matters — Sonnet 5 and Sonnet 4.6
# are not the same price, and a bare "sonnet" key would have silently charged one as the
# other.
version: pricing-v2
currency: USD
unit_tokens: 1000000

models:
  # Frontier reasoning tier
  claude-fable-5-1:  { input: 10.00, output: 50.00 }
  claude-mythos-5-1: { input: 10.00, output: 50.00 }
  claude-fable-5:    { input: 10.00, output: 50.00 }
  fable:             { input: 10.00, output: 50.00 }

  # Opus family — 5, 4.8, 4.7, 4.6 all at this rate
  claude-opus-5:     { input: 5.00,  output: 25.00 }
  claude-opus-4-8:   { input: 5.00,  output: 25.00 }
  claude-opus-4-7:   { input: 5.00,  output: 25.00 }
  claude-opus-4-6:   { input: 5.00,  output: 25.00 }
  opus:              { input: 5.00,  output: 25.00 }

  # Sonnet — the generations differ, so both are listed explicitly
  claude-sonnet-5:   { input: 2.00,  output: 10.00 }
  claude-sonnet-4-6: { input: 3.00,  output: 15.00 }
  sonnet:            { input: 3.00,  output: 15.00 }

  claude-haiku-4-5:  { input: 1.00,  output: 5.00 }
  haiku:             { input: 1.00,  output: 5.00 }

  # Older and retired models. Listed because a run trace can carry an old id long after the
  # model is gone (and Opus 4.1 / Opus 4 remain reachable on Bedrock and Google Cloud).
  # Without these, an Opus 4.1 run would fall through to the mid-tier default and be priced
  # at a FIFTH of what it cost.
  claude-opus-4-5:   { input: 5.00,  output: 25.00 }
  claude-opus-4-1:   { input: 15.00, output: 75.00 }
  claude-opus-4:     { input: 15.00, output: 75.00 }
  claude-sonnet-4-5: { input: 3.00,  output: 15.00 }
  claude-sonnet-4:   { input: 3.00,  output: 15.00 }
  claude-haiku-3-5:  { input: 0.80,  output: 4.00 }

# Used when the captured model id matches no key above. Mid-tier, and the report labels
# any run costed this way so an unknown model never looks precisely priced.
default: { input: 3.00, output: 15.00 }

# Not modelled, deliberately, with the multipliers named so the size of the error is known:
#   * cache reads 0.1x base (0.025x on Fable 5.1) and writes 1.25x / 2x — these dominate a
#     long session, so a cache-heavy run is over-estimated here, often by a lot;
#   * batch 0.5x; fast mode on Opus 5 / 4.8 $10/$50; `inference_geo: "us"` 1.1x;
#   * partner rates on Bedrock and Google Cloud, which are set by the provider.
# These numbers are an order-of-magnitude aid, not a bill — `/usage` is the real figure.
#
# One fact worth pinning, because recalling it wrongly is easy: Sonnet 5's $2/$10 was
# announced as introductory pricing through 2026-08-31, and the scheduled rise to $3/$15 on
# 2026-09-01 did NOT happen — $2/$10 is the standard price. Confirmed on the live page
# 2026-09-20.
