# WellForge model-routing policy — which model tier each agent runs on.
#
# Why: routing deterministic/structured work to cheaper models and reserving frontier
# models for high-judgment work drives OpEx down without lowering quality where it counts
# (the paper's "intelligent model routing"). Without this, agents inherit the session
# model — usually frontier — so every PO write and lint-fix pays opus prices.
#
# TOOL-NEUTRAL: this file assigns each agent a TIER by judgment level — portable across
# agent CLIs (architect = frontier on any provider). The tier → CONCRETE MODEL resolution
# is per-tool in `model-tiers.yml`; an adapter generates each agent's frontmatter `model:`
# from routing(agent→tier) × tiers(tool→model). `scripts/check-routing.py` verifies a
# tool's generated agent files match. Changing this policy is a PR, like a gate threshold.
# Move agents down a tier only with evidence — too cheap causes rework loops (the OpEx trap).
version: routing-v1

# The three tiers, by judgment level (concrete models per tool live in model-tiers.yml):
#   frontier — highest judgment (design trade-offs, judging quality)
#   mid      — structured writing + implementation
#   cheap    — deterministic, low-judgment surfaces

agents:
  # frontier — never cheap out: a weak architect or a foolable judge poisons everything
  architect:        { tier: frontier, why: "architecture & trade-offs — the highest-leverage judgment in the flow" }
  evaluator:        { tier: frontier, why: "LM-judge — an evaluator that's easily fooled is worse than none" }

  # mid — structured writing & pattern-following implementation; human/QE/eval gates catch slips
  product-owner:    { tier: mid, why: "structured spec writing; the human approval gate backstops quality" }
  designer:         { tier: mid, why: "UX flows against an existing component inventory" }
  frontend-dev:     { tier: mid, why: "implementation against react-ts-vite conventions — the token bulk; sonnet is capable here" }
  backend-dev:      { tier: mid, why: "implementation against the stack skills — the token bulk" }
  devops:           { tier: mid, why: "CI/infra wiring, largely deterministic" }
  quality-engineer: { tier: mid, why: "runs gates + writes tests (test-gen is paper's cheaper tier); judgment backstopped by the eval" }
  adr-writer:       { tier: mid, why: "documents a decision already made" }
  owasp-reviewer:   { tier: mid, why: "OWASP checklist review; OVERRIDE to frontier for regulated/high-risk projects (PII, public sector, financial)" }

  # cheap — none by default. WellForge's agents are all substantive enough that haiku would
  # cause rework loops (false economy). The tier exists for future mechanical surfaces
  # (e.g. a changelog/status-summarizer agent), assigned only with evidence it holds quality.

# ── What "evidence" means, concretely ───────────────────────────────────────────────
# "Move agents down a tier only with evidence" was a rule with no measure attached, which
# makes it a preference. The measure is the REWORK METRIC:
#
#   run-report.py --rework   →  rework rounds per feature and per agent
#
# A rework round is a run whose `qe` or `security` verdict FAILED — work that had to be
# redone — attributed to every agent that participated. The threshold and window live in
# config/rigor-budgets.yml (`rework.hotspot_rounds`, `rework.window_runs`), and
# /wellforge:triage surfaces agents that cross it.
#
# The standard, both directions:
#   DOWN a tier — only when the agent's rework rate over a real window is at or below the
#                 rate of agents already at that tier. "It seemed fine" is not evidence;
#                 neither is one good feature.
#   UP   a tier — when its rework rate exceeds the hotspot threshold. Rework is the OpEx
#                 trap made visible: a cheaper model that needs three rounds costs more
#                 than an expensive one that needs none, and only the first number is
#                 obvious on the invoice.
#
# What the metric does NOT say: whose fault the rework was. A failing AC and a failing
# implementation both land in the same count, and separating them is judgement. The metric
# names a candidate; a human decides.
#
# Escalation: for a genuinely complex feature, run the dev agents at frontier instead of
# mid. The mechanism is the agent frontmatter (fixed per run), so escalation is a
# deliberate human/orchestrator choice — flag it in the plan, then run the harder model —
# not silent per-task auto-routing. Honest about the seam.
#
# Rigor tiers (see the `rigor-tiers` skill) do NOT re-tier agents — frontmatter `model:` is
# fixed per agent, so the same agent can't run at two tiers. Tiers save cost by COMPOSITION:
#   spike — no agents at all; the main loop builds on the session model. This file is unused.
#   mvp   — mid agents only; the orchestrator simply never spawns the frontier agents
#           (architect, evaluator). The map below = the `production` tier.
#   production — the full map below.
