# mise.toml — the WELLFORGE repo itself (not a generated project).
#
# Deliberately thin: no [tools], because this repo is not an application — its toolchain is
# whatever the scripts declare they need, and pinning node/java here would shadow the pins a
# generated project is being tested against. Tasks only.
#
# Run `mise trust` once after cloning.

[tasks.format-templates]
description = "Run each preset's OWN formatter over its rendered output and copy the result back"
run         = "scripts/format-templates.sh"

[tasks."format-templates:check"]
description = "Report what format-templates would change; non-zero if anything would"
run         = "scripts/format-templates.sh --check"

[tasks."test:cli"]
description = "Regression matrix for scripts/wellforge"
run         = "scripts/tests/wellforge.test.sh"

# THE entry point. Every release path takes this as a precondition (release-cli.sh, the
# /wellforge:release procedure, docs/VERSIONING.md), the pre-push hook runs it for release
# tags, and /wellforge:doctor --tests calls it rather than keeping its own list — which is
# how that list came to be missing security-triggers.test.py. Add a suite to
# scripts/check-all.sh and all of them pick it up.
[tasks.check]
description = "Every self-test in this repo, one exit code (add --preset <p> for scaffold gates)"
run         = "scripts/check-all.sh"

[tasks."check:full"]
description = "check, plus one preset's OWN gates on a fresh scaffold (slow, needs mise+uvx)"
run         = "scripts/check-all.sh --preset spring-kotlin-react"

# groma.md — the C4 architecture map in groma/ (see the connections skill, references/groma.md).
# A pinned npx wrapper rather than a [tools] entry: this file deliberately declares no tools,
# and groma is pre-1.0, so the version is a visible, deliberate bump here.
# Usage: mise run groma -- view --plain | scan | agent-instructions
[tasks.groma]
description = "Run the pinned groma.md CLI (groma.md@0.6.6) — pass its arguments after --"
run         = "npx -y groma.md@0.6.6"
