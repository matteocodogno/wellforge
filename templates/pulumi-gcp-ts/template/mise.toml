# mise.toml — project root
# Infrastructure-as-Code project: node + pnpm for the Pulumi TS program, plus the Pulumi CLI.

[tools]
node = "22"
pnpm = "10"
pulumi = "3"

[env]
# Project-level non-sensitive env vars only — secrets go in .mise.local.toml.
# For local runs authenticate with `gcloud auth application-default login` (ADC);
# NEVER commit a service-account key. See AGENTS.md for the credential model.
# _.file = ".env"   ← uncomment to load .env automatically

[settings]
experimental = true    # required for monorepo task features

[tasks.install]
description = "Install infra dependencies"
depends     = ["infra:install"]

[tasks.build]
description = "Compile-check the Pulumi program (tsc, no emit)"
depends     = ["infra:build"]

[tasks.test]
description = "Run unit tests (Pulumi mocks)"
depends     = ["infra:test"]

[tasks.lint]
description = "Lint the Pulumi program (Biome)"
depends     = ["infra:lint"]

[tasks.dev]
description = "Preview changes for the current stack (read-only)"
depends     = ["infra:preview"]

[tasks.release]
description = "Cut a release — version + CHANGELOG from Conventional Commits, tag, GitHub release (release-it)"
run = "pnpm --package=release-it@^17 --package=@release-it/conventional-changelog@^8 --package=@release-it/bumper@^6 dlx release-it"

[tasks.git-policy]
description = "Apply the WellForge git policy to this clone — linear history (run once after cloning)"
run = """
git config merge.ff only          # git merge fast-forwards or fails — never a merge commit
git config pull.rebase true       # git pull rebases instead of merging origin back in
git config rebase.autoStash true  # rebasing with a dirty tree stashes/restores
echo 'git policy applied: linear history (no merge commits). CI enforces it on every PR.'
"""

# ── Per-service delegation ─────────────────────────────────────────────────────
# Why these exist: mise merges config walking UP from the cwd, so the ROOT config does not
# see `infra/mise.toml`'s tasks. `depends = ["infra:install"]` alone fails with
# `task not found: infra:install` — verified on mise 2026.9, and it was every generated
# pulumi project's `mise run install/build/test/lint/dev`. The other two presets carry this
# same block for backend/frontend; this preset was written without it, so its root
# aggregates never worked at all.
# `//infra:install` addressing and an `experimental_monorepo_root` setting do NOT exist in
# this mise (the latter warns "unknown field"), so the portable fix is a root task that sets
# `dir` and re-enters mise there: with cwd inside the service, that service's own mise.toml
# shadows the root's same-named task, so there is exactly ONE definition of each task — in
# the service file — and no recursion.

[tasks."infra:install"]
description = "install (infra)"
dir         = "infra"
run         = "mise run install"

[tasks."infra:build"]
description = "build (infra)"
dir         = "infra"
run         = "mise run build"

[tasks."infra:typecheck"]
description = "typecheck (infra)"
dir         = "infra"
run         = "mise run typecheck"

[tasks."infra:test"]
description = "test (infra)"
dir         = "infra"
run         = "mise run test"

[tasks."infra:lint"]
description = "lint (infra)"
dir         = "infra"
run         = "mise run lint"

[tasks."infra:preview"]
description = "preview (infra)"
dir         = "infra"
run         = "mise run preview"
